spring.application.name=SekouManagement

# backend port:
server.port=8081
#This forces IPv4 instead of IPv6
server.address=0.0.0.0

# servlet
spring.main.web-application-type=servlet

# dev tools
spring.devtools.add-properties=false

# Database connection. DB_PASSWORD must be supplied by the runtime environment.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sekou_manage?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.jwt_key=${JWT_KEY}
# Hikari
#spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# mybatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl


